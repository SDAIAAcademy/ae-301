[project]
name = "applied-nlp-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course AE-301 Applied Natural Language Processing Engineering"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "torch>=2.6",
    "tokenizers>=0.21",
    "huggingface-hub>=0.30",
    "openai>=1.80",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
]

[tool.uv]
package = false

# CPU wheels of PyTorch: nothing in the labs needs a graphics processor
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
