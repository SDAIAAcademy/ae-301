<section>
<h2>Day 1: Represent</h2>
<ol>
<li><p>Sawaqi routes 60,000 messages a month with a hosted model. Each call sends 180 tokens of instructions and a message of about 15 tokens. Which single change cuts the bill most?</p><ul><li><b>A.</b> Translating Arabizi messages to English first</li><li><b>B.</b> Removing diacritics and tatweel from every message</li><li><b>C.</b> Shortening the instructions from 180 to 90 tokens</li><li><b>D.</b> Switching the hosted model to an Arabic tokeniser</li></ul></li>
<li><p>Hessa's agents type an account number into Ghayth's semantic search and get ten unrelated messages. The same search works well for "brown water in Al-Qalaa". What do you change?</p><ul><li><b>A.</b> Add an exact lookup on the account number beside the vector search</li><li><b>B.</b> Move to a larger embedding model</li><li><b>C.</b> Replace the approximate index by a flat one</li><li><b>D.</b> Embed each message together with its customer's name</li></ul></li>
<li><p>A national utility must label 2 million messages a day with one of eight departments, on its own servers without graphics processors, and has 50,000 labelled messages. Which design fits?</p><ul><li><b>A.</b> A large prompted decoder that writes the department name</li><li><b>B.</b> An encoder-decoder that translates the message into a label</li><li><b>C.</b> An embedding model and a search over all labelled messages</li><li><b>D.</b> A small encoder with a classification head, fine-tuned on the labels</li></ul></li>
<li><p>A new version raises test macro F1 from 0.85 to 0.87: MSA 0.94 to 0.97, Gulf 0.86 to 0.90, English 0.81 to 0.84, Arabizi 0.42 to 0.31. What do you report?</p><ul><li><b>A.</b> An improvement of two points, ready to ship</li><li><b>B.</b> A gain for three varieties, a loss for Arabizi, and a hand-off rule for Arabizi</li><li><b>C.</b> No real change, since the Arabizi test set is too small to matter</li><li><b>D.</b> A regression that must be rolled back in full</li></ul></li>
<li><p>A utility's messages are sent to a hosted model. For the same complaint, the provider reports 14 tokens for the English version and 46 for the Modern Standard Arabic version. The Arabic text has no diacritics and no typos. What is the most likely cause?</p><ul><li><b>A.</b> The Arabic text was not normalised before it was sent</li><li><b>B.</b> The Arabic message contains more words than the English one</li><li><b>C.</b> The model's tokeniser was trained mostly on English text</li><li><b>D.</b> The provider counts Arabic characters instead of tokens</li></ul></li>
<li><p>An Arabic WordPiece tokeniser turns the word العِداد (with one diacritic) into [UNK], and the same word without the diacritic into two known pieces. Where does the failure come from?</p><ul><li><b>A.</b> The vocabulary has no piece with a diacritic</li><li><b>B.</b> The classifier after the tokeniser was never trained on this word</li><li><b>C.</b> The message mixes two scripts in one word</li><li><b>D.</b> The word is too long for the tokeniser's maximum length</li></ul></li>
<li><p>A routing call sends 200 tokens of instructions and a message of 20 tokens. The input price is 0.50 USD per million tokens. What do 1,000 calls cost in input tokens?</p><ul><li><b>A.</b> 0.01 USD</li><li><b>B.</b> 0.10 USD</li><li><b>C.</b> 0.11 USD</li><li><b>D.</b> 1.10 USD</li></ul></li>
<li><p>You compute the attention weights of one head for a six-token sentence in a decoder. What must be true of the row of the third token?</p><ul><li><b>A.</b> It is zero for tokens one and two and sums to 1</li><li><b>B.</b> It is equal for all six tokens and sums to the number of tokens</li><li><b>C.</b> It is zero for the third token itself and sums to the number of heads</li><li><b>D.</b> It is zero for tokens four to six and sums to 1</li></ul></li>
<li><p>A team must tag every word of a message as part of a district name, part of an account number, or neither. They have 3,000 labelled messages and need answers in milliseconds on a processor. Which design fits best?</p><ul><li><b>A.</b> A decoder prompted to rewrite the message with tags</li><li><b>B.</b> An encoder with one classification score per token</li><li><b>C.</b> An embedding model and a nearest-neighbour search per message</li><li><b>D.</b> An encoder with one classification score per message</li></ul></li>
<li><p>A search returns its top 10 messages for a query. The query has 6 relevant messages in the archive, and 3 of them are in the top 10. What is recall at 10?</p><ul><li><b>A.</b> 0.30</li><li><b>B.</b> 0.50</li><li><b>C.</b> 0.60</li><li><b>D.</b> 1.00</li></ul></li>
<li><p>A character n-gram search scores recall at 10 of 0.45 for English queries and 0.03 for queries written in Arabizi. The relevant messages for each query are in all four varieties. What explains the Arabizi number best?</p><ul><li><b>A.</b> The metric divides by the wrong number of relevant messages for this variety</li><li><b>B.</b> Arabizi queries are shorter than English queries</li><li><b>C.</b> The index holds fewer Arabizi messages than it should</li><li><b>D.</b> Arabizi spellings vary, so few letter sequences are shared</li></ul></li>
<li><p>Agents search the archive two ways: by a description of the problem, and by a ticket number such as SW-48213. The vector search is good at the first and poor at the second. What should the team build?</p><ul><li><b>A.</b> An exact lookup for ticket numbers beside it</li><li><b>B.</b> A second vector index that holds only ticket numbers</li><li><b>C.</b> A rule that rewrites ticket numbers into words before embedding</li><li><b>D.</b> A larger embedding model for both kinds of query</li></ul></li>
<li><p>A router for three departments has F1 of 0.90 for billing (500 test messages), 0.80 for supply (400) and 0.10 for connections (100). What is its macro F1?</p><ul><li><b>A.</b> 0.60</li><li><b>B.</b> 0.72</li><li><b>C.</b> 0.78</li><li><b>D.</b> 0.90</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Generate</h2>
<ol>
<li><p>A message contains العَدّاد with diacritics. The Arabic tokeniser returns [UNK] and the router sends the message to the wrong department. Where is the fix?</p><ul><li><b>A.</b> Retrain the router with more epochs</li><li><b>B.</b> Ask for a tokeniser with a larger vocabulary</li><li><b>C.</b> Leave it, since diacritics are rare in customer messages</li><li><b>D.</b> Normalise the text before the tokeniser sees it</li></ul></li>
<li><p>Ghayth routes with a prompted model. The same message is sent to billing on one run and to meters on the next. What do you change first?</p><ul><li><b>A.</b> Add ten examples to the prompt</li><li><b>B.</b> Set the temperature to 0 and limit the output to a label</li><li><b>C.</b> Move to a larger model</li><li><b>D.</b> Call the model three times and take the majority</li></ul></li>
<li><p>You switch on constrained decoding. Every reply now parses and matches the schema. Which check can you still not drop?</p><ul><li><b>A.</b> That every reply has the three keys</li><li><b>B.</b> That the district is one of the eight in the list</li><li><b>C.</b> That the account placeholder is one that occurs in this message</li><li><b>D.</b> That the reply is JSON and nothing else</li></ul></li>
<li><p>A customer asks what the second residential tier costs. The top chunk is R-02, which lists all four tiers. The reply says "SAR 1.20 [R-02]"; the rule says SAR 2.50. Where do you look first?</p><ul><li><b>A.</b> At the generator: the prompt and how the four tiers read in one sentence</li><li><b>B.</b> At the retriever: return ten chunks instead of three</li><li><b>C.</b> At the index: replace keywords by embeddings</li><li><b>D.</b> At the model: fine-tune it on the rule book</li></ul></li>
<li><p>The smaller model matches the larger one on English and MSA, loses 20 points on Arabizi, and costs less than half. 15% of messages are Arabizi. What do you recommend?</p><ul><li><b>A.</b> The smaller model for everything, since it costs less than half</li><li><b>B.</b> The larger model for everything, since it is better somewhere</li><li><b>C.</b> Either one, since the two models are equivalent</li><li><b>D.</b> Route by variety: the larger model or a person for Arabizi; confirm on more messages</li></ul></li>
<li><p>A grounded assistant answers 20 questions from a rule book. For 5 wrong answers, the rule that answers the question was not among the retrieved chunks. For 2 others, the rule was retrieved and the reply states a wrong figure. Which part needs work first?</p><ul><li><b>A.</b> The evaluation set, because seven errors in twenty are too many to be real</li><li><b>B.</b> The generator, because it wrote all seven wrong answers</li><li><b>C.</b> The retriever, because five errors happen before the model reads</li><li><b>D.</b> The prompt, because a stricter prompt fixes both kinds</li></ul></li>
<li><p>A grounded assistant must tell the customer when the rule book does not answer a question. Why does the course ask for the exact reply NOT_IN_RULES and not a polite sentence?</p><ul><li><b>A.</b> A fixed string is cheaper to generate than a sentence</li><li><b>B.</b> Code can detect it, count it and hand the question on</li><li><b>C.</b> Customers prefer short replies to long ones</li><li><b>D.</b> The model cannot write polite sentences when the temperature is 0</li></ul></li>
<li><p>An extractor is scored on 100 messages for the field district. The gold data has a district in 60 messages. The extractor returns a district in 50 messages, and 45 of those are right. What are precision and recall for this field?</p><ul><li><b>A.</b> Precision 0.45, recall 0.75</li><li><b>B.</b> Precision 0.75, recall 0.90</li><li><b>C.</b> Precision 0.90, recall 0.45</li><li><b>D.</b> Precision 0.90, recall 0.75</li></ul></li>
<li><p>Before a message goes to a hosted model, the account number is replaced by [ACCOUNT_1]. The model returns the account field as 3055512345. The message had no such number. What should the service do?</p><ul><li><b>A.</b> Reject it, because the model only saw a placeholder</li><li><b>B.</b> Accept it when the number exists in the customer table</li><li><b>C.</b> Reject it only when the confidence is low</li><li><b>D.</b> Accept it, because it matches the pattern of an account number</li></ul></li>
<li><p>A masking step replaces phone numbers that match 05 and eight digits. Its test passes on 200 messages. In production, a customer writes the phone number as ٠٥٥ ١٢٣ ٤٥٦٧ and it reaches the hosted model. Which two things did the masking miss?</p><ul><li><b>A.</b> A wrong country code and a missing name</li><li><b>B.</b> Diacritics on the digits and a long message</li><li><b>C.</b> A second phone number and a greeting in English</li><li><b>D.</b> Arabic-Indic digits, and spaces in the number</li></ul></li>
<li><p>An extraction reply fails validation, is repaired once, and fails again. The course's loop then logs the failure and returns no fields. Why does it not try a third and fourth time?</p><ul><li><b>A.</b> A third reply would overwrite the log entry of the first</li><li><b>B.</b> Validation errors are random, so further retries could make no difference</li><li><b>C.</b> Each retry costs a call and rarely succeeds after two failures</li><li><b>D.</b> The provider forbids more than two calls for one message</li></ul></li>
<li><p>Three routers are measured on the same test split. A: macro F1 0.85, Arabizi 0.42, 5 ms at the 95th percentile, no cost per call. B: 0.88, Arabizi 0.70, 900 ms, 0.04 USD per 1,000. C: 0.63, Arabizi 0.28, 20 ms, no cost per call. The budget is 300 ms at the 95th percentile. Which recommendation holds?</p><ul><li><b>A.</b> A for all messages, and nothing more to do</li><li><b>B.</b> A, with Arabizi handed to a person or sent to B off the real-time path</li><li><b>C.</b> B for all messages, because it has the highest macro F1</li><li><b>D.</b> C for all messages, because a neural model will improve as more data arrives</li></ul></li>
<li><p>On 40 test messages, ten per variety, model X scores 0.70 for Gulf and model Y scores 0.60. On 400 messages, 150 of them Gulf, the two models score 0.82 and 0.84 for Gulf. What should you conclude?</p><ul><li><b>A.</b> X is better for Gulf, as the first test showed</li><li><b>B.</b> Y is better for Gulf, as the second test showed</li><li><b>C.</b> The two are close for Gulf; ten messages cannot rank them</li><li><b>D.</b> The second test is wrong, because both scores changed between the tests</li></ul></li>
<li><p>A prompted router gives the same message two different departments on two runs. The team sets the temperature to 0 and the label is now stable. What do they know about the label?</p><ul><li><b>A.</b> It is stable; whether it is right is unmeasured</li><li><b>B.</b> It is correct, because the model is now certain</li><li><b>C.</b> It is the label most customers would choose</li><li><b>D.</b> It will stay the same after a change to another model</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Adapt</h2>
<ol>
<li><p>Ghayth extracts fields with a hosted model. A reply has valid JSON with "account_number": "3055512345". The message, as sent, contained [ACCOUNT_1]. What does the service do with this reply?</p><ul><li><b>A.</b> Accepts it, since it matches the account pattern</li><li><b>B.</b> Rejects it, since the model only ever saw a placeholder</li><li><b>C.</b> Accepts it if the number exists in the customer table</li><li><b>D.</b> Asks a second model whether the number is plausible</li></ul></li>
<li><p>A colleague fine-tunes the encoder with six learning rates, scores every run on the test split and reports the best: macro F1 0.66. What is the honest status of that number?</p><ul><li><b>A.</b> Too few runs: with twelve learning rates it would be reliable</li><li><b>B.</b> Fine, since the test messages were never used for training</li><li><b>C.</b> Optimistic: the test split chose the run, so it is no longer unseen</li><li><b>D.</b> Invalid: all six runs must be repeated on new data</li></ul></li>
<li><p>You fine-tune for 40 epochs. Validation macro F1 is highest at epoch 12 and slightly lower afterwards, while the training loss falls to 0.01. Which weights do you measure on the test split?</p><ul><li><b>A.</b> Those of epoch 12, the best validation epoch</li><li><b>B.</b> Those of epoch 40, where the loss is lowest</li><li><b>C.</b> Those of whichever epoch scores best on the test split</li><li><b>D.</b> An average of the weights of all 40 epochs</li></ul></li>
<li><p>Latifa updates the tariff rule book four times a year. A colleague proposes a new low-rank adapter each quarter so that Ghayth "knows" the current prices. What do you answer?</p><ul><li><b>A.</b> Yes, with a higher rank so that the adapter can hold the prices</li><li><b>B.</b> Yes, but with full fine-tuning, since adapters lose quality</li><li><b>C.</b> No: adapters over quantised weights would round the prices</li><li><b>D.</b> No: keep prices in the rule book and retrieve them; adapt for skills</li></ul></li>
<li><p>The served router scores macro F1 0.85 overall and 0.42 for Arabizi, and hands 94% of Arabizi messages to a person. Which sentence belongs in the model card?</p><ul><li><b>A.</b> "Supports Arabic and English with a macro F1 of 0.85."</li><li><b>B.</b> "Arabizi support will improve in the next version."</li><li><b>C.</b> "Arabizi: macro F1 0.42; 94% of these messages go to a person."</li><li><b>D.</b> "Performance varies with out-of-distribution orthography."</li></ul></li>
<li><p>A linear layer has a weight matrix of 512 by 512. You add a low-rank adapter of rank 4 to it. How many trainable numbers does the adapter have?</p><ul><li><b>A.</b> 2,048</li><li><b>B.</b> 4,096</li><li><b>C.</b> 8,192</li><li><b>D.</b> 262,144</li></ul></li>
<li><p>A model has 100 million parameters. With Adam, a trainable weight needs 16 bytes during training and a frozen 32-bit weight needs 4 bytes. You train adapters that are 1% of the parameters and freeze the rest. About how much memory do the weights need during training?</p><ul><li><b>A.</b> 0.4 GB</li><li><b>B.</b> 0.6 GB</li><li><b>C.</b> 1.6 GB</li><li><b>D.</b> 2.0 GB</li></ul></li>
<li><p>On the same split, full fine-tuning of a small encoder reaches test macro F1 0.63 with 530,000 trainable parameters. A rank-8 adapter reaches 0.41 with 9,000. Training memory is not a constraint for this model. Which run do you carry into the comparison with the baseline?</p><ul><li><b>A.</b> The adapter, because a model with fewer trainable parameters always generalises better</li><li><b>B.</b> The full run, because memory is not scarce and it scores higher</li><li><b>C.</b> Neither, because the two runs cannot be compared</li><li><b>D.</b> The adapter, because it trains 98% fewer parameters</li></ul></li>
<li><p>A routing model scores macro F1 0.91 on a random split and 0.86 when the split keeps each customer on one side. A third of the customers wrote the same complaint more than once. Which number predicts the score on a customer who has never written before?</p><ul><li><b>A.</b> The mean of the two, 0.885</li><li><b>B.</b> Neither, because both numbers were measured on the same data</li><li><b>C.</b> 0.91, because it uses more varied training data</li><li><b>D.</b> 0.86, because no copy of a test message was trained on</li></ul></li>
<li><p>A colleague fine-tunes with six learning rates, scores each run on the test split, and reports the best test score as the model's quality. What is the flaw?</p><ul><li><b>A.</b> The test split chose the learning rate, so it is no longer unseen</li><li><b>B.</b> The learning rate should be chosen on the training loss</li><li><b>C.</b> The best score should be averaged with the worst</li><li><b>D.</b> Six runs are too few to find a good learning rate for an encoder of this size</li></ul></li>
<li><p>Sawaqi's leaks team will label 1,000 messages as a leak in the street or a leak at the meter. Two labellers first labelled the same 100: they agree on 82, kappa 0.57, and 14 of the 18 splits are messages about water in the meter box that A called a meter leak and B a street leak. What comes first?</p><ul><li><b>A.</b> Start labelling all 1,000: with 82% agreement the model will average out the noise</li><li><b>B.</b> Keep the 82 messages both agree on and train on them</li><li><b>C.</b> Add a rule for water in the meter box, label the same 100 again blind, then measure</li><li><b>D.</b> Ask a third labeller to settle each of the 18 splits, then train on the settled labels</li></ul></li>
<li><p>A routing service passes its smoke test: 24 messages, all answered with status 200, and the four edge cases handed to a person. What does this result establish?</p><ul><li><b>A.</b> The service routes at least 20 of 24 messages correctly</li><li><b>B.</b> The model's macro F1 is above the hand-off threshold</li><li><b>C.</b> The service meets its latency budget at the 95th percentile</li><li><b>D.</b> The service answers and handles the edge cases</li></ul></li>
<li><p>A model card reports macro F1 0.85 on the test split and says the model supports Arabic and English. By variety the scores are MSA 0.94, Gulf 0.86, English 0.81 and Arabizi 0.42. Which line must be added before the card is signed?</p><ul><li><b>A.</b> The average length of a message in tokens</li><li><b>B.</b> The number of parameters of the model</li><li><b>C.</b> Results by variety and a hand-off rule for Arabizi</li><li><b>D.</b> The name of the engineer who trained and evaluated the model</li></ul></li>
<li><p>A service hands a message to a person when the best probability is below 0.5, or 0.7 for Arabizi. An Arabizi message gets leaks with probability 0.62 and an English message gets billing with 0.55. What happens to the two messages?</p><ul><li><b>A.</b> Both are handed to a person</li><li><b>B.</b> The Arabizi one goes to a person; the English one is routed</li><li><b>C.</b> The English message is handed to a person; the Arabizi one is routed</li><li><b>D.</b> Both are routed by the model</li></ul></li>
<li><p>A model answers in 4 ms when called in a notebook. Behind the service, the same message takes 9 ms at the median and 35 ms at the 95th percentile. The budget is 300 ms at the 95th percentile. What do you report?</p><ul><li><b>A.</b> 35 ms, a breach because it is eight times the model's latency</li><li><b>B.</b> The mean of 9 ms and 35 ms</li><li><b>C.</b> 4 ms, the model's own latency</li><li><b>D.</b> 9 ms and 35 ms through the service, inside the budget</li></ul></li>
</ol>

ion 1","title":"Generative language models"},{"n":2,"label":"Session 2","title":"Prompting and structured outputs"},{"n":3,"label":"Session 3","title":"Retrieval-augmented generation"},{"n":4,"label":"Session 4","title":"Model selection and evaluation"}]},{"n":3,"id":"day3","label":"Day 3","title":"Adapt","sessions":[{"n":1,"label":"Session 1","title":"Fine-tuning data"},{"n":2,"label":"Session 2","title":"Fine-tuning an encoder"},{"n":3,"label":"Session 3","title":"Low-rank and quantised adapters"},{"n":4,"label":"Session 4","title":"Evaluate and deploy"}]},{"n":4,"id":"day4","label":"Capstone","title":"Capstone: a routing and extraction service and its defence","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-tokenisers-q1","type":"single","prompt":"Sawaqi routes 60,000 messages a month with a hosted model. Each call sends 180 tokens of instructions and a message of about 15 tokens. Which single change cuts the bill most?","options":[{"key":"A","text":"Translating Arabizi messages to English first"},{"key":"B","text":"Removing diacritics and tatweel from every message"},{"key":"C","text":"Shortening the instructions from 180 to 90 tokens"},{"key":"D","text":"Switching the hosted model to an Arabic tokeniser"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The instructions are sent with every message and are over 90% of the tokens. Halving them nearly halves the bill; no change to the message comes close.","misconceptions":["Looks at the variety gap in the message and misses that the message is a small part of each call","Treats normalising as a cost saver: it removes a few tokens per message, not the instructions","","Assumes a tokeniser can be swapped: it belongs to the model and cannot be chosen separately"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-tokenisers","title":"Which change cuts the token bill most?"},"level":null,"pool":"checkpoint"},{"id":"check-semantic-search-q1","type":"single","prompt":"Hessa's agents type an account number into Ghayth's semantic search and get ten unrelated messages. The same search works well for \"brown water in Al-Qalaa\". What do you change?","options":[{"key":"A","text":"Add an exact lookup on the account number beside the vector search"},{"key":"B","text":"Move to a larger embedding model"},{"key":"C","text":"Replace the approximate index by a flat one"},{"key":"D","text":"Embed each message together with its customer's name"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Embeddings place texts by meaning, and an identifier has none. Exact fields need exact matching; a hybrid of both serves both kinds of query.","misconceptions":["","Believes a larger model understands identifiers: a random number has no meaning at any size","Confuses the index with the representation: an exact index returns the same poor neighbours faster or slower","Assumes more context fixes it: the number is still a string of digits with no meaning to embed"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-semantic-search","title":"An agent searches for an account number and gets nonsense"},"level":null,"pool":"checkpoint"},{"id":"check-which-family-q1","type":"single","prompt":"A national utility must label 2 million messages a day with one of eight departments, on its own servers without graphics processors, and has 50,000 labelled messages. Which design fits?","options":[{"key":"A","text":"A large prompted decoder that writes the department name"},{"key":"B","text":"An encoder-decoder that translates the message into a label"},{"key":"C","text":"An embedding model and a search over all labelled messages"},{"key":"D","text":"A small encoder with a classification head, fine-tuned on the labels"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The task is one decision per message with plenty of labels: an encoder reads the message once in both directions and a head returns eight scores, fast enough for processors.","misconceptions":["Reaches for the largest model: a decoder generates token by token and is far too slow and costly at this volume on processors","Mixes up the families: an encoder-decoder is built to produce text such as a translation, not a single label","Uses the embedding as the decision: nearest-neighbour search works, but it stores and searches 50,000 vectors per message where a head needs eight scores",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-which-family","title":"Two million messages a day, eight departments"},"level":null,"pool":"checkpoint"},{"id":"check-macro-f1-q1","type":"single","prompt":"A new version raises test macro F1 from 0.85 to 0.87: MSA 0.94 to 0.97, Gulf 0.86 to 0.90, English 0.81 to 0.84, Arabizi 0.42 to 0.31. What do you report?","options":[{"key":"A","text":"An improvement of two points, ready to ship"},{"key":"B","text":"A gain for three varieties, a loss for Arabizi, and a hand-off rule for Arabizi"},{"key":"C","text":"No real change, since the Arabizi test set is too small to matter"},{"key":"D","text":"A regression that must be rolled back in full"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The average hides a group that got worse. A hand-off rule for that group lets the other three keep their gain.","misconceptions":["Reads the average only: it rose because the large varieties rose, while one customer group lost a quarter of its score","","Treats the small group as noise: 51 messages are few, but an 11-point drop on them is a pattern to investigate, not to ignore","Throws away a real gain: three varieties improved, and the Arabizi loss can be contained with a hand-off rule"],"lo":["LO5"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-macro-f1","title":"One number went up. Did the router get better?"},"level":null,"pool":"checkpoint"},{"id":"review-day-1-q1","type":"single","prompt":"A message contains العَدّاد with diacritics. The Arabic tokeniser returns [UNK] and the router sends the message to the wrong department. Where is the fix?","options":[{"key":"A","text":"Retrain the router with more epochs"},{"key":"B","text":"Ask for a tokeniser with a larger vocabulary"},{"key":"C","text":"Leave it, since diacritics are rare in customer messages"},{"key":"D","text":"Normalise the text before the tokeniser sees it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The failure happens before the model: the tokeniser has no piece with a diacritic. Removing diacritics first turned 1,052 unknown pieces into 0.","misconceptions":["Blames the classifier: it never received the word, so no amount of training on clean text helps","Changes the wrong part: a larger vocabulary trained on text without diacritics still has no piece for them","Treats a systematic spelling problem as rare noise: 1,052 pieces were unknown in the archive",""],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day-1","title":"Before we generate anything"},"level":null,"pool":"checkpoint"},{"id":"check-sampling-q1","type":"single","prompt":"Ghayth routes with a prompted model. The same message is sent to billing on one run and to meters on the next. What do you change first?","options":[{"key":"A","text":"Add ten examples to the prompt"},{"key":"B","text":"Set the temperature to 0 and limit the output to a label"},{"key":"C","text":"Move to a larger model"},{"key":"D","text":"Call the model three times and take the majority"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The variation comes from the draw, not from the model's knowledge. Remove the draw for a decision; then measure whether the single answer is right.","misconceptions":["Adds examples before removing the randomness: with sampling on, a longer prompt still gives two answers","","Buys a bigger model to fix a setting: a larger model sampled at a high temperature also varies","Hides the variation instead of removing it: a majority vote triples the cost of every message"],"lo":["LO5"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-sampling","title":"The same message, a different department each run"},"level":null,"pool":"checkpoint"},{"id":"check-structured-outputs-q1","type":"single","prompt":"You switch on constrained decoding. Every reply now parses and matches the schema. Which check can you still not drop?","options":[{"key":"A","text":"That every reply has the three keys"},{"key":"B","text":"That the district is one of the eight in the list"},{"key":"C","text":"That the account placeholder is one that occurs in this message"},{"key":"D","text":"That the reply is JSON and nothing else"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A schema can say \"a string\" or \"one of these eight\". It cannot say \"a value that is true of this message\". That stays in your validator and in your precision and recall.","misconceptions":["Keeps a check the constraint already covers: a missing key can no longer occur","Same: the constraint restricts the district to the list, so this can no longer fail","","Checks the format again: valid JSON is exactly what constrained decoding guarantees"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-structured-outputs","title":"The provider now guarantees schema-valid JSON"},"level":null,"pool":"checkpoint"},{"id":"check-grounded-q1","type":"single","prompt":"A customer asks what the second residential tier costs. The top chunk is R-02, which lists all four tiers. The reply says \"SAR 1.20 [R-02]\"; the rule says SAR 2.50. Where do you look first?","options":[{"key":"A","text":"At the generator: the prompt and how the four tiers read in one sentence"},{"key":"B","text":"At the retriever: return ten chunks instead of three"},{"key":"C","text":"At the index: replace keywords by embeddings"},{"key":"D","text":"At the model: fine-tune it on the rule book"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Retrieval did its job: the rule is in the context and is cited. The error is in reading it, so the fix is the prompt or the form of the chunk, for example one tier per line.","misconceptions":["","Blames retrieval although the gold rule is the top hit: more chunks add more figures to confuse","Changes the index although the right chunk was found: embeddings would retrieve the same rule","Moves facts into weights: the tariff changes every quarter, and the model would still have to pick the right tier"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-grounded","title":"The right rule, the wrong price"},"level":null,"pool":"checkpoint"},{"id":"check-model-selection-q1","type":"single","prompt":"The smaller model matches the larger one on English and MSA, loses 20 points on Arabizi, and costs less than half. 15% of messages are Arabizi. What do you recommend?","options":[{"key":"A","text":"The smaller model for everything, since it costs less than half"},{"key":"B","text":"The larger model for everything, since it is better somewhere"},{"key":"C","text":"Either one, since the two models are equivalent"},{"key":"D","text":"Route by variety: the larger model or a person for Arabizi; confirm on more messages"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The choice is per group of messages, not per system. Each model is used where it is good enough, and ten messages per variety is a reason to confirm before signing.","misconceptions":["Decides on the average cost and forgets who pays for it: one customer in seven would be routed much worse","Pays the higher price for the 85% of messages where the cheaper model is as good","Reads a tie on ten messages per variety as proof: the sample cannot separate close models, so the question stays open rather than closed",""],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-model-selection","title":"The cheaper model ties on English"},"level":null,"pool":"checkpoint"},{"id":"review-day-2-q1","type":"single","prompt":"Ghayth extracts fields with a hosted model. A reply has valid JSON with \"account_number\": \"3055512345\". The message, as sent, contained [ACCOUNT_1]. What does the service do with this reply?","options":[{"key":"A","text":"Accepts it, since it matches the account pattern"},{"key":"B","text":"Rejects it, since the model only ever saw a placeholder"},{"key":"C","text":"Accepts it if the number exists in the customer table"},{"key":"D","text":"Asks a second model whether the number is plausible"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Masking makes invention provable: any real-looking account number in the reply cannot have come from the message. The validator rejects it and the repair call asks again.","misconceptions":["Checks the shape only: the number looks like an account number, yet the model never saw one","","Lets an invented value pass because it happens to exist in a table","Replaces a rule with a guess: the validator knows the mapping, so nothing needs estimating"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day-2","title":"Before we train anything"},"level":null,"pool":"checkpoint"},{"id":"check-test-set-q1","type":"single","prompt":"A colleague fine-tunes the encoder with six learning rates, scores every run on the test split and reports the best: macro F1 0.66. What is the honest status of that number?","options":[{"key":"A","text":"Too few runs: with twelve learning rates it would be reliable"},{"key":"B","text":"Fine, since the test messages were never used for training"},{"key":"C","text":"Optimistic: the test split chose the run, so it is no longer unseen"},{"key":"D","text":"Invalid: all six runs must be repeated on new data"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The best of six test scores is partly luck that fits this test split. Choose on the validation split; then measure the chosen run once on the test split.","misconceptions":["Sees a search problem: more runs would make the selection effect larger, not smaller","Treats selection as harmless because no weights were trained on the test data","","Throws the work away: the runs are valid, only the choice must move to validation"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-test-set","title":"Six learning rates, one test set"},"level":null,"pool":"checkpoint"},{"id":"check-validation-peak-q1","type":"single","prompt":"You fine-tune for 40 epochs. Validation macro F1 is highest at epoch 12 and slightly lower afterwards, while the training loss falls to 0.01. Which weights do you measure on the test split?","options":[{"key":"A","text":"Those of epoch 12, the best validation epoch"},{"key":"B","text":"Those of epoch 40, where the loss is lowest"},{"key":"C","text":"Those of whichever epoch scores best on the test split"},{"key":"D","text":"An average of the weights of all 40 epochs"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The validation split exists to make this choice. After its peak, the model fits the training messages more closely without doing better on unseen ones.","misconceptions":["","Trusts the training loss: it measures memory of the training messages, not skill on new ones","Lets the test split choose the epoch, which makes its score optimistic","Averages good and overfitted weights without a reason to expect a gain"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-validation-peak","title":"Validation peaked early"},"level":null,"pool":"checkpoint"},{"id":"check-adapters-q1","type":"single","prompt":"Latifa updates the tariff rule book four times a year. A colleague proposes a new low-rank adapter each quarter so that Ghayth \"knows\" the current prices. What do you answer?","options":[{"key":"A","text":"Yes, with a higher rank so that the adapter can hold the prices"},{"key":"B","text":"Yes, but with full fine-tuning, since adapters lose quality"},{"key":"C","text":"No: adapters over quantised weights would round the prices"},{"key":"D","text":"No: keep prices in the rule book and retrieve them; adapt for skills"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A changed file is searchable, citable and auditable within minutes. Weights give no citation and no guarantee that the old price is gone.","misconceptions":["Assumes rank is the issue: no rank makes weights a reliable store for exact prices","Moves the same mistake to more weights: full fine-tuning stores prices no more reliably","Treats quantisation as the risk when the problem is where the facts live",""],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-adapters","title":"The tariff changes every quarter"},"level":null,"pool":"checkpoint"},{"id":"check-model-card-q1","type":"single","prompt":"The served router scores macro F1 0.85 overall and 0.42 for Arabizi, and hands 94% of Arabizi messages to a person. Which sentence belongs in the model card?","options":[{"key":"A","text":"\"Supports Arabic and English with a macro F1 of 0.85.\""},{"key":"B","text":"\"Arabizi support will improve in the next version.\""},{"key":"C","text":"\"Arabizi: macro F1 0.42; 94% of these messages go to a person.\""},{"key":"D","text":"\"Performance varies with out-of-distribution orthography.\""}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A card states the limit by group, with the number and with what the service does about it, in words its reader can staff against.","misconceptions":["States the average and a language list: true, and hides the one group the model fails","Promises a fix instead of stating today's limit: a card describes the model as it is served","","Hides the limit in a technical term that a contact-centre lead cannot act on"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-model-card","title":"One sentence about Arabizi"},"level":null,"pool":"checkpoint"},{"id":"q-tokens-01","type":"single","prompt":"A utility's messages are sent to a hosted model. For the same complaint, the provider reports 14 tokens for the English version and 46 for the Modern Standard Arabic version. The Arabic text has no diacritics and no typos. What is the most likely cause?","options":[{"key":"A","text":"The Arabic text was not normalised before it was sent"},{"key":"B","text":"The Arabic message contains more words than the English one"},{"key":"C","text":"The model's tokeniser was trained mostly on English text"},{"key":"D","text":"The provider counts Arabic characters instead of tokens"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A byte-level tokeniser with few Arabic merges falls back to short byte pieces, about two per letter, so the same content costs about three times the tokens.","misconceptions":["Reaches for normalisation when the text is already clean","Counts words: Arabic versions of the same complaint have fewer words, not three times more","","Confuses the unit: providers bill tokens, and characters would give a different ratio"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"tokens-per-variety","title":"The same complaint costs a different number of tokens in each variety"},"level":"analyze","pool":"practice"},{"id":"q-tokens-02","type":"single","prompt":"An Arabic WordPiece tokeniser turns the word العِداد (with one diacritic) into [UNK], and the same word without the diacritic into two known pieces. Where does the failure come from?","options":[{"key":"A","text":"The vocabulary has no piece with a diacritic"},{"key":"B","text":"The classifier after the tokeniser was never trained on this word"},{"key":"C","text":"The message mixes two scripts in one word"},{"key":"D","text":"The word is too long for the tokeniser's maximum length"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The tokeniser's training text had no diacritics, so no vocabulary piece contains one and the whole word becomes unknown.","misconceptions":["","Locates the failure after the step where it happens","Sees a script problem where there is one script","Blames length: the word has six letters"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"two-failures-traced","title":"Two failures, each traced to its cause"},"level":"analyze","pool":"practice"},{"id":"q-tokens-03","type":"single","prompt":"A routing call sends 200 tokens of instructions and a message of 20 tokens. The input price is 0.50 USD per million tokens. What do 1,000 calls cost in input tokens?","options":[{"key":"A","text":"0.01 USD"},{"key":"B","text":"0.10 USD"},{"key":"C","text":"0.11 USD"},{"key":"D","text":"1.10 USD"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each call sends 220 tokens; 1,000 calls are 220,000 tokens, which is 0.22 of a million, times 0.50 USD = 0.11 USD.","misconceptions":["Prices the messages only and forgets the instructions","Prices the instructions only and forgets the messages","","Slips one decimal place in the conversion to millions"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"price-per-thousand","title":"Price the difference, then look at what you are paying for"},"level":"apply","pool":"practice"},{"id":"q-attention-01","type":"single","prompt":"You compute the attention weights of one head for a six-token sentence in a decoder. What must be true of the row of the third token?","options":[{"key":"A","text":"It is zero for tokens one and two and sums to 1"},{"key":"B","text":"It is equal for all six tokens and sums to the number of tokens"},{"key":"C","text":"It is zero for the third token itself and sums to the number of heads"},{"key":"D","text":"It is zero for tokens four to six and sums to 1"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A decoder masks every later position before the softmax, so those weights are exactly zero, and a softmax row sums to 1.","misconceptions":["Reverses the mask: a decoder looks back, not ahead","Confuses attention with an average over all tokens","Mixes up the softmax over tokens with the number of heads",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"encoder-sees-both-ways","title":"An encoder reads both ways; a decoder only looks back"},"level":"understand","pool":"practice"},{"id":"q-attention-02","type":"single","prompt":"A team must tag every word of a message as part of a district name, part of an account number, or neither. They have 3,000 labelled messages and need answers in milliseconds on a processor. Which design fits best?","options":[{"key":"A","text":"A decoder prompted to rewrite the message with tags"},{"key":"B","text":"An encoder with one classification score per token"},{"key":"C","text":"An embedding model and a nearest-neighbour search per message"},{"key":"D","text":"An encoder with one classification score per message"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The task needs one decision per token, with both sides of the word in view: an encoder with a token-classification head does that in one pass.","misconceptions":["Generates text for a labelling task, at many times the latency","","Returns similar messages, not a label for each word","Gives one label for the whole message, which cannot mark single words"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"which-family-for-which-job","title":"Match the family to the job before you match the model"},"level":"evaluate","pool":"practice"},{"id":"q-search-01","type":"single","prompt":"A search returns its top 10 messages for a query. The query has 6 relevant messages in the archive, and 3 of them are in the top 10. What is recall at 10?","options":[{"key":"A","text":"0.30"},{"key":"B","text":"0.50"},{"key":"C","text":"0.60"},{"key":"D","text":"1.00"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Recall at 10 divides the relevant messages found (3) by the relevant messages a list of ten could hold, min(10, 6) = 6: 0.50.","misconceptions":["Divides by the length of the list: that is precision at 10","","Divides the relevant messages by the list length","Counts a query as solved when any relevant message appears"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"recall-at-ten","title":"Recall at 10: of the relevant messages a top-10 list could hold, how many it holds"},"level":"apply","pool":"practice"},{"id":"q-search-02","type":"single","prompt":"A character n-gram search scores recall at 10 of 0.45 for English queries and 0.03 for queries written in Arabizi. The relevant messages for each query are in all four varieties. What explains the Arabizi number best?","options":[{"key":"A","text":"The metric divides by the wrong number of relevant messages for this variety"},{"key":"B","text":"Arabizi queries are shorter than English queries"},{"key":"C","text":"The index holds fewer Arabizi messages than it should"},{"key":"D","text":"Arabizi spellings vary, so few letter sequences are shared"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A lexical search finds shared letter sequences; Arabizi has no fixed spelling, so a query shares few of them even with other Arabizi messages, and none with Arabic script.","misconceptions":["Suspects the metric although the same code scored English","Blames length: the queries are of similar length in every variety","Suspects the index when the baseline simply cannot match across spellings",""],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"ngram-baseline-by-variety","title":"A character n-gram baseline finds its own script and little else"},"level":"analyze","pool":"practice"},{"id":"q-search-03","type":"single","prompt":"Agents search the archive two ways: by a description of the problem, and by a ticket number such as SW-48213. The vector search is good at the first and poor at the second. What should the team build?","options":[{"key":"A","text":"An exact lookup for ticket numbers beside it"},{"key":"B","text":"A second vector index that holds only ticket numbers"},{"key":"C","text":"A rule that rewrites ticket numbers into words before embedding"},{"key":"D","text":"A larger embedding model for both kinds of query"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A ticket number has no meaning to embed; exact identifiers need exact matching, and the two searches can sit side by side.","misconceptions":["","Keeps the wrong tool for the job in a second copy","Invents a transformation that adds no meaning","Expects size to give meaning to an identifier"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"where-meaning-search-fails","title":"Semantic search fails where there is no meaning to embed"},"level":"evaluate","pool":"practice"},{"id":"q-rag-01","type":"single","prompt":"A grounded assistant answers 20 questions from a rule book. For 5 wrong answers, the rule that answers the question was not among the retrieved chunks. For 2 others, the rule was retrieved and the reply states a wrong figure. Which part needs work first?","options":[{"key":"A","text":"The evaluation set, because seven errors in twenty are too many to be real"},{"key":"B","text":"The generator, because it wrote all seven wrong answers"},{"key":"C","text":"The retriever, because five errors happen before the model reads"},{"key":"D","text":"The prompt, because a stricter prompt fixes both kinds"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"In five cases the model never saw the rule, so no prompt can fix them; the retriever is the larger and earlier cause.","misconceptions":["Dismisses the measurement instead of reading it","Attributes every error to the last step of the pipeline","","Expects a prompt to supply a rule that is not in the context"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"score-the-two-parts-apart","title":"Score the retriever and the generator apart"},"level":"analyze","pool":"practice"},{"id":"q-rag-02","type":"single","prompt":"A grounded assistant must tell the customer when the rule book does not answer a question. Why does the course ask for the exact reply NOT_IN_RULES and not a polite sentence?","options":[{"key":"A","text":"A fixed string is cheaper to generate than a sentence"},{"key":"B","text":"Code can detect it, count it and hand the question on"},{"key":"C","text":"Customers prefer short replies to long ones"},{"key":"D","text":"The model cannot write polite sentences when the temperature is 0"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An exact string can be tested and acted on by code; a free sentence that means the same cannot be counted reliably.","misconceptions":["Thinks of token cost, which is negligible here","","Confuses the internal signal with the text a customer finally sees","Misreads what temperature does"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"answer-from-the-rules-only","title":"Answer from the rules, cite the rule, or say the rules are silent"},"level":"understand","pool":"practice"},{"id":"q-extract-01","type":"single","prompt":"An extractor is scored on 100 messages for the field district. The gold data has a district in 60 messages. The extractor returns a district in 50 messages, and 45 of those are right. What are precision and recall for this field?","options":[{"key":"A","text":"Precision 0.45, recall 0.75"},{"key":"B","text":"Precision 0.75, recall 0.90"},{"key":"C","text":"Precision 0.90, recall 0.45"},{"key":"D","text":"Precision 0.90, recall 0.75"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Precision is right values over returned values, 45 / 50 = 0.90; recall is right values over gold values, 45 / 60 = 0.75.","misconceptions":["Divides the right values by all 100 messages for precision","Swaps the two definitions","Divides the right values by all 100 messages for recall",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"valid-json-is-not-right","title":"Valid JSON every time is a format guarantee, not a correctness guarantee"},"level":"apply","pool":"practice"},{"id":"q-extract-02","type":"single","prompt":"Before a message goes to a hosted model, the account number is replaced by [ACCOUNT_1]. The model returns the account field as 3055512345. The message had no such number. What should the service do?","options":[{"key":"A","text":"Reject it, because the model only saw a placeholder"},{"key":"B","text":"Accept it when the number exists in the customer table"},{"key":"C","text":"Reject it only when the confidence is low"},{"key":"D","text":"Accept it, because it matches the pattern of an account number"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The model saw masked text, so a real-looking number in its answer cannot come from the message: it is invented, and the validator rejects it.","misconceptions":["","Lets an invented value pass because it happens to exist","Waits for a confidence that an extraction reply does not carry","Checks the shape of the value and not where it came from"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"mask-before-it-leaves","title":"Mask personal fields before the text leaves, and put them back after"},"level":"evaluate","pool":"practice"},{"id":"q-extract-03","type":"single","prompt":"A masking step replaces phone numbers that match 05 and eight digits. Its test passes on 200 messages. In production, a customer writes the phone number as ٠٥٥ ١٢٣ ٤٥٦٧ and it reaches the hosted model. Which two things did the masking miss?","options":[{"key":"A","text":"A wrong country code and a missing name"},{"key":"B","text":"Diacritics on the digits and a long message"},{"key":"C","text":"A second phone number and a greeting in English"},{"key":"D","text":"Arabic-Indic digits, and spaces in the number"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The pattern expects ten Western digits in a row; this number is in Arabic-Indic digits and is broken by spaces, so the pattern never matches.","misconceptions":["Looks for causes that are not in the example","Applies letter problems to digits","Invents content the message does not have",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"masking-has-a-test","title":"A masking step without a test is a hope"},"level":"analyze","pool":"practice"},{"id":"q-extract-04","type":"single","prompt":"An extraction reply fails validation, is repaired once, and fails again. The course's loop then logs the failure and returns no fields. Why does it not try a third and fourth time?","options":[{"key":"A","text":"A third reply would overwrite the log entry of the first"},{"key":"B","text":"Validation errors are random, so further retries could make no difference"},{"key":"C","text":"Each retry costs a call and rarely succeeds after two failures"},{"key":"D","text":"The provider forbids more than two calls for one message"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Retries have a price and falling returns; a logged failure goes to a person, which is safer than a guessed value.","misconceptions":["Misunderstands the log, which keeps one entry per attempt","Treats systematic errors as chance","","Invents a provider rule"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"validate-repair-log","title":"Validate, repair once, then log and hand off"},"level":"understand","pool":"practice"},{"id":"q-lora-01","type":"single","prompt":"A linear layer has a weight matrix of 512 by 512. You add a low-rank adapter of rank 4 to it. How many trainable numbers does the adapter have?","options":[{"key":"A","text":"2,048"},{"key":"B","text":"4,096"},{"key":"C","text":"8,192"},{"key":"D","text":"262,144"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A has 4 × 512 numbers and B has 512 × 4: 2,048 + 2,048 = 4,096.","misconceptions":["Counts only one of the two matrices","","Doubles the rank or counts each matrix twice","Counts the frozen weight matrix itself"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"low-rank-update","title":"Freeze the weight matrix; learn its change as two thin matrices"},"level":"apply","pool":"practice"},{"id":"q-lora-02","type":"single","prompt":"A model has 100 million parameters. With Adam, a trainable weight needs 16 bytes during training and a frozen 32-bit weight needs 4 bytes. You train adapters that are 1% of the parameters and freeze the rest. About how much memory do the weights need during training?","options":[{"key":"A","text":"0.4 GB"},{"key":"B","text":"0.6 GB"},{"key":"C","text":"1.6 GB"},{"key":"D","text":"2.0 GB"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Frozen: 99 million × 4 bytes = 396 MB. Trainable: 1 million × 16 bytes = 16 MB. Together about 412 MB, or 0.4 GB.","misconceptions":["","Adds a full copy of gradients for the frozen weights","Charges every weight as trainable","Charges every weight as trainable and adds the frozen copy again"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"memory-budget","title":"Training keeps every trainable weight four times"},"level":"apply","pool":"practice"},{"id":"q-lora-03","type":"single","prompt":"On the same split, full fine-tuning of a small encoder reaches test macro F1 0.63 with 530,000 trainable parameters. A rank-8 adapter reaches 0.41 with 9,000. Training memory is not a constraint for this model. Which run do you carry into the comparison with the baseline?","options":[{"key":"A","text":"The adapter, because a model with fewer trainable parameters always generalises better"},{"key":"B","text":"The full run, because memory is not scarce and it scores higher"},{"key":"C","text":"Neither, because the two runs cannot be compared"},{"key":"D","text":"The adapter, because it trains 98% fewer parameters"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An adapter trades quality for memory; when memory is not scarce, the saving buys nothing and the higher score decides.","misconceptions":["Turns a tendency into a rule that the measured scores contradict","","Refuses a comparison made on the same split with the same metric","Optimises a number that is not the constraint"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"adapter-vs-full","title":"The adapter trains 1.7% of the weights and gives up 13 points"},"level":"evaluate","pool":"practice"},{"id":"q-split-01","type":"single","prompt":"A routing model scores macro F1 0.91 on a random split and 0.86 when the split keeps each customer on one side. A third of the customers wrote the same complaint more than once. Which number predicts the score on a customer who has never written before?","options":[{"key":"A","text":"The mean of the two, 0.885"},{"key":"B","text":"Neither, because both numbers were measured on the same data"},{"key":"C","text":"0.91, because it uses more varied training data"},{"key":"D","text":"0.86, because no copy of a test message was trained on"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With a random split, near-copies of test messages sit in the training set, so the test is partly a memory test; the split by customer removes that.","misconceptions":["Averages a biased and an unbiased estimate","Overlooks that the way of splitting is exactly what differs","Mistakes leakage for variety",""],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"leak-inflates-the-score","title":"A random split tests the model on messages it has nearly seen"},"level":"analyze","pool":"practice"},{"id":"q-split-02","type":"single","prompt":"A colleague fine-tunes with six learning rates, scores each run on the test split, and reports the best test score as the model's quality. What is the flaw?","options":[{"key":"A","text":"The test split chose the learning rate, so it is no longer unseen"},{"key":"B","text":"The learning rate should be chosen on the training loss"},{"key":"C","text":"The best score should be averaged with the worst"},{"key":"D","text":"Six runs are too few to find a good learning rate for an encoder of this size"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Choosing among runs by test score fits the choice to the test split; a validation split is for choosing, the test split for one final measurement.","misconceptions":["","Chooses on the data the model has memorised","Proposes arithmetic that does not remove the selection effect","Focuses on the size of the search and misses the leak"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"pick-the-epoch-on-validation","title":"The training loss keeps falling; the validation score stops"},"level":"evaluate","pool":"practice"},{"id":"q-labels-01","type":"single","prompt":"Sawaqi's leaks team will label 1,000 messages as a leak in the street or a leak at the meter. Two labellers first labelled the same 100: they agree on 82, kappa 0.57, and 14 of the 18 splits are messages about water in the meter box that A called a meter leak and B a street leak. What comes first?","options":[{"key":"A","text":"Start labelling all 1,000: with 82% agreement the model will average out the noise"},{"key":"B","text":"Keep the 82 messages both agree on and train on them"},{"key":"C","text":"Add a rule for water in the meter box, label the same 100 again blind, then measure"},{"key":"D","text":"Ask a third labeller to settle each of the 18 splits, then train on the settled labels"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Most splits are one pair on one kind of message: the guideline is missing a rule. Write it with an example, re-label the sample blind and check kappa again before labelling at scale; the 82% includes agreement expected by chance, and kappa of 0.57 is low.","misconceptions":["Reads raw agreement as quality and ignores both chance and the concentrated split","Drops exactly the hard cases that production will send","","Settles this sample but leaves the rule unwritten, so the 1,000 split the same way"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"fix-the-guideline","title":"Fix the guideline, label the same sample again, then train"},"level":"evaluate","pool":"practice"},{"id":"q-decide-01","type":"single","prompt":"A router for three departments has F1 of 0.90 for billing (500 test messages), 0.80 for supply (400) and 0.10 for connections (100). What is its macro F1?","options":[{"key":"A","text":"0.60"},{"key":"B","text":"0.72"},{"key":"C","text":"0.78"},{"key":"D","text":"0.90"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Macro F1 is the plain mean over departments: (0.90 + 0.80 + 0.10) / 3 = 0.60.","misconceptions":["","Rounds a size-weighted mean downwards","Weights each department by its number of messages","Reports the best department"],"lo":["LO5"],"day":1,"session":4,"slide":{"deck":"day1","id":"macro-f1-by-hand","title":"Macro F1 gives every department one vote, however small"},"level":"apply","pool":"practice"},{"id":"q-decide-02","type":"single","prompt":"Three routers are measured on the same test split. A: macro F1 0.85, Arabizi 0.42, 5 ms at the 95th percentile, no cost per call. B: 0.88, Arabizi 0.70, 900 ms, 0.04 USD per 1,000. C: 0.63, Arabizi 0.28, 20 ms, no cost per call. The budget is 300 ms at the 95th percentile. Which recommendation holds?","options":[{"key":"A","text":"A for all messages, and nothing more to do"},{"key":"B","text":"A, with Arabizi handed to a person or sent to B off the real-time path"},{"key":"C","text":"B for all messages, because it has the highest macro F1"},{"key":"D","text":"C for all messages, because a neural model will improve as more data arrives"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"B breaks the latency budget and C is worse than A everywhere; A fits the budget, and its weak variety needs a hand-off or a slower path.","misconceptions":["Accepts 0.42 for one customer group without a rule for it","","Ignores the latency budget","Chooses on a hope instead of the measurements"],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"choose-on-four-columns","title":"A model is chosen on four columns, and a leaderboard has one"},"level":"evaluate","pool":"practice"},{"id":"q-decide-03","type":"single","prompt":"On 40 test messages, ten per variety, model X scores 0.70 for Gulf and model Y scores 0.60. On 400 messages, 150 of them Gulf, the two models score 0.82 and 0.84 for Gulf. What should you conclude?","options":[{"key":"A","text":"X is better for Gulf, as the first test showed"},{"key":"B","text":"Y is better for Gulf, as the second test showed"},{"key":"C","text":"The two are close for Gulf; ten messages cannot rank them"},{"key":"D","text":"The second test is wrong, because both scores changed between the tests"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With ten messages one error moves the score by several points; on 150 messages the models are two points apart, which is still within noise.","misconceptions":["Trusts the smaller sample","Reads a two-point gap as a ranking","","Expects scores to be stable across sample sizes"],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"forty-messages-are-few","title":"Forty messages, ten per variety: enough to find failures, not to rank close models"},"level":"analyze","pool":"practice"},{"id":"q-decide-04","type":"single","prompt":"A prompted router gives the same message two different departments on two runs. The team sets the temperature to 0 and the label is now stable. What do they know about the label?","options":[{"key":"A","text":"It is stable; whether it is right is unmeasured"},{"key":"B","text":"It is correct, because the model is now certain"},{"key":"C","text":"It is the label most customers would choose"},{"key":"D","text":"It will stay the same after a change to another model"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Temperature 0 removes the random draw; the single remaining answer is the model's most likely one, right or wrong.","misconceptions":["","Confuses repeatability with correctness","Reads a model probability as a survey","Extends a setting's effect to another model"],"lo":["LO5"],"day":2,"session":1,"slide":{"deck":"day2","id":"settings-follow-the-task","title":"Set the knobs by what a wrong output costs"},"level":"understand","pool":"practice"},{"id":"q-serve-01","type":"single","prompt":"A routing service passes its smoke test: 24 messages, all answered with status 200, and the four edge cases handed to a person. What does this result establish?","options":[{"key":"A","text":"The service routes at least 20 of 24 messages correctly"},{"key":"B","text":"The model's macro F1 is above the hand-off threshold"},{"key":"C","text":"The service meets its latency budget at the 95th percentile"},{"key":"D","text":"The service answers and handles the edge cases"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A smoke test checks that the service answers and handles edge cases; quality needs the held-out test split, and latency its own measurement.","misconceptions":["Reads correctness into a test that did not check labels","Mixes a score with a threshold","Assumes a timing that the test did not take",""],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"smoke-test-is-not-quality","title":"A smoke test proves the service is alive and sane at the edges"},"level":"understand","pool":"practice"},{"id":"q-serve-02","type":"single","prompt":"A model card reports macro F1 0.85 on the test split and says the model supports Arabic and English. By variety the scores are MSA 0.94, Gulf 0.86, English 0.81 and Arabizi 0.42. Which line must be added before the card is signed?","options":[{"key":"A","text":"The average length of a message in tokens"},{"key":"B","text":"The number of parameters of the model"},{"key":"C","text":"Results by variety and a hand-off rule for Arabizi"},{"key":"D","text":"The name of the engineer who trained and evaluated the model"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A card states limits by subgroup: one customer group is served far worse than the average says, and the card must say when its messages go to a person.","misconceptions":["Adds a statistic that does not show the failure","Adds a fact that changes no decision","","Adds provenance where the missing part is a limit"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"model-card-by-variety","title":"A model card says who the model fails, and what happens then"},"level":"evaluate","pool":"practice"},{"id":"q-serve-03","type":"single","prompt":"A service hands a message to a person when the best probability is below 0.5, or 0.7 for Arabizi. An Arabizi message gets leaks with probability 0.62 and an English message gets billing with 0.55. What happens to the two messages?","options":[{"key":"A","text":"Both are handed to a person"},{"key":"B","text":"The Arabizi one goes to a person; the English one is routed"},{"key":"C","text":"The English message is handed to a person; the Arabizi one is routed"},{"key":"D","text":"Both are routed by the model"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"0.62 is below the Arabizi threshold of 0.7, so that message is handed off; 0.55 is above the general threshold of 0.5, so the English one is routed.","misconceptions":["Applies the Arabizi threshold to both","","Swaps the two thresholds","Applies the general threshold to both"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"hand-off-rule","title":"The hand-off rule is part of the model, and it has a price"},"level":"apply","pool":"practice"},{"id":"q-serve-04","type":"single","prompt":"A model answers in 4 ms when called in a notebook. Behind the service, the same message takes 9 ms at the median and 35 ms at the 95th percentile. The budget is 300 ms at the 95th percentile. What do you report?","options":[{"key":"A","text":"35 ms, a breach because it is eight times the model's latency"},{"key":"B","text":"The mean of 9 ms and 35 ms"},{"key":"C","text":"4 ms, the model's own latency"},{"key":"D","text":"9 ms and 35 ms through the service, inside the budget"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The customer waits for the service, not for the model alone; the median and the 95th percentile through the service are the numbers to report against the budget.","misconceptions":["Compares with the wrong reference: the budget is 300 ms","Averages two percentiles into a number with no meaning","Reports the part instead of the whole path",""],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"latency-through-the-service","title":"Measure latency through the service, not around the model"},"level":"analyze","pool":"practice"}]}</script>
